name: gxf
description: "Application de gestion interne GXF"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.12.0

  # Navigation
  go_router: ^17.1.0

  # Gestion d'état
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # UI
  google_fonts: ^8.0.2
  fl_chart: ^1.2.0
  flutter_slidable: ^3.1.0

  # PDF
  pdf: ^3.12.0
  printing: ^5.14.3

  # Utilitaires
  intl: ^0.20.2
  uuid: ^4.5.3
  shared_preferences: ^2.5.4
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.1
  file_picker: ^10.3.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1   # ← juste le nom et la version ici

# Configuration icônes — au même niveau que "dependencies", pas dedans
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1A56A0"
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/